<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81b64c"/>
      <stop offset="100%" stop-color="#457524"/>
    </linearGradient>
    <linearGradient id="pieceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Chessboard Motif Grid in Background -->
  <g opacity="0.12">
    <rect x="136" y="136" width="60" height="60" fill="#ffffff"/>
    <rect x="256" y="136" width="60" height="60" fill="#ffffff"/>
    <rect x="196" y="196" width="60" height="60" fill="#ffffff"/>
    <rect x="316" y="196" width="60" height="60" fill="#ffffff"/>
    <rect x="136" y="256" width="60" height="60" fill="#ffffff"/>
    <rect x="256" y="256" width="60" height="60" fill="#ffffff"/>
    <rect x="196" y="316" width="60" height="60" fill="#ffffff"/>
    <rect x="316" y="316" width="60" height="60" fill="#ffffff"/>
  </g>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Chess Knight Icon -->
  <g filter="url(#shadow)">
    <!-- Base Plate -->
    <path d="M 160 384 L 352 384 C 352 384 358 368 344 356 C 330 344 316 348 300 348 C 284 348 228 348 212 348 C 196 348 182 344 168 356 C 154 368 160 384 160 384 Z" fill="url(#pieceGrad)"/>
    <path d="M 176 352 C 192 344 220 342 256 342 C 292 342 320 344 336 352" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Knight Body & Head -->
    <path d="M 180 348 C 176 312 188 280 204 252 C 176 244 162 220 166 196 C 170 172 194 160 216 168 C 220 152 232 136 248 128 C 264 120 284 124 296 136 C 316 128 340 136 348 156 C 356 176 344 200 336 216 C 352 248 352 300 332 348 Z" fill="url(#pieceGrad)"/>

    <!-- Mane and Details -->
    <path d="M 276 148 C 292 164 296 188 288 212" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 312 176 C 324 196 324 220 316 244" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 330 228 C 336 248 334 272 324 292" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Eye -->
    <circle cx="216" cy="192" r="8" fill="#1e293b"/>
    <circle cx="218" cy="190" r="2.5" fill="#ffffff"/>

    <!-- Muzzle / Nostril / Jawline -->
    <path d="M 180 236 C 188 238 198 234 204 224" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 212 256 C 228 268 252 272 272 264" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
